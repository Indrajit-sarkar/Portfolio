<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <meta name="robots" content="noindex">
    <meta property="og:title" content="404 | Indrajit Sarkar">
    <meta property="og:description" content="Page not found — this route doesn't exist.">
    <meta property="og:type" content="website">
    <title>404 | Indrajit Sarkar</title>
    <link rel="icon" href="assets/opt/logo-640.webp" type="image/webp">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #0d1117;
            color: #f3f2ee;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .scene {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem 1.5rem calc(1.5rem + 120px);
        }
        @media (max-height: 520px) {
            .scene { padding-bottom: calc(0.75rem + 90px); }
            .hint { margin-bottom: 1.2rem; }
        }

        /* ── stars ── */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #f3f2ee;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        .star:nth-child(1)  { top:  8%; left: 12%; animation-delay: 0s;    opacity: 0.5; }
        .star:nth-child(2)  { top: 15%; left: 75%; animation-delay: 0.7s;  opacity: 0.3; width: 3px; height: 3px; }
        .star:nth-child(3)  { top: 25%; left: 40%; animation-delay: 1.4s;  opacity: 0.6; }
        .star:nth-child(4)  { top:  5%; left: 55%; animation-delay: 0.3s;  opacity: 0.4; }
        .star:nth-child(5)  { top: 35%; left: 88%; animation-delay: 2.1s;  opacity: 0.5; width: 3px; height: 3px; }
        .star:nth-child(6)  { top: 42%; left: 20%; animation-delay: 1.0s;  opacity: 0.3; }
        .star:nth-child(7)  { top: 60%; left: 65%; animation-delay: 0.5s;  opacity: 0.4; }
        .star:nth-child(8)  { top: 72%; left: 30%; animation-delay: 1.8s;  opacity: 0.6; }
        .star:nth-child(9)  { top: 80%; left: 82%; animation-delay: 2.5s;  opacity: 0.3; width: 3px; height: 3px; }
        .star:nth-child(10) { top: 18%; left: 92%; animation-delay: 0.9s;  opacity: 0.5; }
        .star:nth-child(11) { top: 50%; left:  5%; animation-delay: 1.6s;  opacity: 0.4; }
        .star:nth-child(12) { top: 90%; left: 50%; animation-delay: 2.2s;  opacity: 0.5; }

        @keyframes twinkle {
            0%   { opacity: 0.2; }
            100% { opacity: 0.8; }
        }

        /* ── 404 text ── */
        .code {
            position: relative;
            z-index: 1;
            font-size: clamp(4.5rem, 14vw, 9rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
            background: linear-gradient(100deg, #c0a377, #a78766 60%, #d8c6a4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
            animation: glow-pulse 3s ease-in-out infinite alternate;
        }

        @keyframes glow-pulse {
            0%   { filter: drop-shadow(0 0 12px rgba(192, 163, 119, 0.35)); }
            100% { filter: drop-shadow(0 0 28px rgba(192, 163, 119, 0.55)); }
        }

        .subtitle {
            position: relative;
            z-index: 1;
            font-size: clamp(1.05rem, 3vw, 1.5rem);
            font-weight: 400;
            color: rgba(243, 242, 238, 0.6);
            margin-bottom: 0.6rem;
            letter-spacing: 0.01em;
        }

        .hint {
            position: relative;
            z-index: 1;
            font-size: clamp(0.82rem, 2vw, 0.95rem);
            color: rgba(243, 242, 238, 0.35);
            margin-bottom: 2.2rem;
            max-width: 380px;
            line-height: 1.55;
        }

        /* ── button — matches portfolio btn-primary ── */
        .btn-back {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.9rem 2.2rem;
            border: none;
            border-radius: 99px;
            font-family: inherit;
            font-weight: 700;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            background: linear-gradient(100deg, #c0a377, #a78766 60%, #d8c6a4);
            background-size: 160% 100%;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 -1px 1px rgba(0, 0, 0, 0.2),
                0 10px 30px -10px rgba(192, 163, 119, 0.45);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        background-position 0.5s;
            overflow: hidden;
        }
        .btn-back::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(115deg, transparent 32%, rgba(255,255,255,0.28) 46%, transparent 60%);
            transform: translateX(-130%);
            transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-back:hover {
            background-position: 90% 0;
            transform: translateY(-2px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.4),
                inset 0 -1px 1px rgba(0,0,0,0.2),
                0 16px 40px -12px rgba(167, 135, 102, 0.6);
        }
        .btn-back:hover::after {
            transform: translateX(130%);
        }
        .btn-back:active {
            transform: scale(0.96);
        }

        .btn-back svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── ground line ── */
        .ground {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(192, 163, 119, 0.25), transparent);
            z-index: 0;
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            .hint { padding: 0 0.5rem; }
        }
    </style>
</head>
<body>
    <!-- Stars -->
    <div class="stars" aria-hidden="true">
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
    </div>

    <div class="scene">
        <div class="code">404</div>
        <p class="subtitle">Page not found</p>
        <p class="hint">Looks like this page drifted into the void. Even my jetpack couldn't save it.</p>

        <a href="/" class="btn-back">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            Back to Portfolio
        </a>
    </div>

    <div class="ground" aria-hidden="true"></div>

    <!-- Alex walks in, finds nothing, and jetpacks away.
         Absolute paths: this page is served for any missing URL, at any depth. -->
    <link rel="stylesheet" href="/pet/pet.css?v=10">
    <script defer src="/pet/pet.js?v=10" data-mode="404"></script>
</body>
</html>

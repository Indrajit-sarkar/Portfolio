<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Indrajit Sarkar - Professional Certifications">
    <title>Certifications | Indrajit Sarkar</title>
    <link rel="icon" type="image/jpeg" href="Images/logo.JPG">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
/* ========================================
   CERTIFICATIONS PORTFOLIO - MINIMAL DESIGN
   ======================================== */

/* ========== CSS VARIABLES - DARK THEME (default) ========== */
:root,
[data-theme="dark"] {
    --primary-blue: #3b82f6;
    --primary-green: #10b981;
    --primary-orange: #f97316;
    --bg-primary: #000000;
    --bg-secondary: #0a0a0a;
    --text-primary: #f5f5f7;
    --text-secondary: rgba(245, 245, 247, 0.8);
    --text-muted: rgba(245, 245, 247, 0.5);
    --glass-bg: rgba(30, 30, 30, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --shadow-color: rgba(0, 0, 0, 0.3);
}

/* ========== LIGHT THEME ========== */
[data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f8f9fa;
    --text-primary: #1d1d1f;
    --text-secondary: rgba(29, 29, 31, 0.85);
    --text-muted: rgba(29, 29, 31, 0.6);
    --glass-bg: rgba(255, 255, 255, 0.3);
    --glass-border: rgba(0, 0, 0, 0.1);
    --shadow-color: rgba(0, 0, 0, 0.1);
}

/* ========== BASE ========== */
*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    transition: background 0.3s ease, color 0.3s ease;
    min-height: 100vh;
}

/* ========== THEME TOGGLE ========== */
.theme-toggle {
    position: fixed;
    top: 2rem;
    right: 2rem;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 1000;
    box-shadow: 0 4px 12px var(--shadow-color);
}

.theme-toggle:hover {
    transform: scale(1.1) rotate(15deg);
}

.theme-icon {
    width: 24px;
    height: 24px;
}

[data-theme="light"] .sun-icon {
    display: none;
}

[data-theme="light"] .moon-icon {
    display: block;
}

[data-theme="dark"] .sun-icon {
    display: block;
}

[data-theme="dark"] .moon-icon {
    display: none;
}

/* ========== BACK BUTTON ========== */
.back-btn {
    position: fixed;
    top: 2rem;
    left: 2rem;
    padding: 0.8rem 1.5rem;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 50px;
    color: var(--text-primary);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    z-index: 1000;
    box-shadow: 0 4px 12px var(--shadow-color);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.back-btn:hover {
    transform: translateX(-5px);
    background: rgba(102, 126, 234, 0.3);
    border-color: rgba(102, 126, 234, 0.5);
}

@media (max-width: 768px) {
    .back-btn {
        top: 1rem;
        left: 1rem;
        padding: 0.6rem 1.2rem;
        font-size: 0.85rem;
    }
    
    .theme-toggle {
        top: 1rem;
        right: 1rem;
        width: 45px;
        height: 45px;
    }
}

/* ========== CERTIFICATIONS SECTION ========== */
.certifications {
    padding: 4rem 0;
    max-width: 100%;
    margin: 0 auto;
    min-height: 100vh;
}

.section-header {
    text-align: center;
    margin-bottom: 3rem;
    padding: 0 2rem;
}

.section-title {
    font-size: clamp(2.5rem, 5vw, 4rem);
    font-weight: 800;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, var(--primary-blue), var(--primary-green), var(--primary-orange));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.section-subtitle {
    font-size: 1.2rem;
    color: var(--text-secondary);
}

.certifications-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    padding: 0;
    width: 100%;
}

@media (max-width: 1024px) {
    .certifications-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 640px) {
    .certifications-grid {
        grid-template-columns: 1fr;
    }
}

.cert-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 0;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px var(--shadow-color);
    display: flex;
    flex-direction: column;
    position: relative;
}

.cert-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 24px var(--shadow-color);
    border-color: var(--primary-blue);
    z-index: 10;
}

.cert-preview {
    width: 100%;
    height: 0;
    padding-bottom: 70.7%;
    background: #fff;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--glass-border);
}

.cert-preview::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 10;
    cursor: pointer;
}

.cert-preview-embed {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
    user-select: none;
    z-index: 1;
}

.cert-info {
    padding: 1.5rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    background: var(--bg-secondary);
}

.cert-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.4;
    margin: 0;
    text-align: center;
}

/* ========== CERTIFICATE MODAL ========== */
.cert-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    z-index: 9999;
    display: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    padding: 2rem;
    overflow-y: auto;
}

.cert-modal-overlay.active {
    display: flex;
    opacity: 1;
    align-items: center;
    justify-content: center;
}

.cert-card-preview {
    width: 85vw;
    max-width: 85vw;
    background: var(--glass-bg);
    backdrop-filter: blur(60px) saturate(200%);
    -webkit-backdrop-filter: blur(60px) saturate(200%);
    border: 2px solid var(--glass-border);
    border-radius: 24px;
    padding: 2rem;
    box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    gap: 2rem;
    animation: modalSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
}

.cert-card-preview::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: linear-gradient(135deg,
        transparent 20%,
        rgba(255, 255, 255, 0.1) 45%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0.1) 55%,
        transparent 80%);
    background-size: 300% 300%;
    animation: liquid-shimmer 8s infinite linear;
    pointer-events: none;
    border-radius: 24px;
    z-index: 0;
}

@keyframes liquid-shimmer {
    0% {
        background-position: 200% 0;
    }
    100% {
        background-position: -100% 0;
    }
}

@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.cert-preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 1;
}

.cert-preview-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text-primary);
}

.cert-preview-close {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--glass-border);
    color: var(--text-primary);
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    flex-shrink: 0;
}

.cert-preview-close:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: rotate(90deg);
}

.cert-preview-body {
    position: relative;
    z-index: 1;
}

.cert-preview-container {
    position: relative;
    width: 100%;
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
}

.cert-preview-iframe {
    width: 100%;
    height: 75vh;
    min-height: 600px;
    border: none;
    display: block;
    background: white;
}

.cert-preview-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    position: relative;
    z-index: 1;
}

.cert-btn {
    padding: 1rem 2.5rem;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    justify-content: center;
    min-width: 160px;
    position: relative;
    overflow: hidden;
}

.cert-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
}

.cert-btn:hover::before {
    transform: translateX(100%);
}

.cert-btn-close {
    background: rgba(220, 38, 38, 0.2);
    border: 1px solid rgba(220, 38, 38, 0.4);
    color: #ef4444;
    backdrop-filter: blur(20px);
}

.cert-btn-close:hover {
    background: rgba(220, 38, 38, 0.3);
    border-color: #ef4444;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(220, 38, 38, 0.3);
}

[data-theme="light"] .cert-btn-close {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border: none;
    color: white;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
}

[data-theme="light"] .cert-btn-close:hover {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
}

.cert-btn-view {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
}

.cert-btn-view:hover {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
}

.cert-btn-download {
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #10b981;
    backdrop-filter: blur(20px);
}

.cert-btn-download:hover {
    background: rgba(16, 185, 129, 0.3);
    border-color: #10b981;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
}

[data-theme="light"] .cert-btn-download {
    background: linear-gradient(135deg, #10b981, #059669);
    border: none;
    color: white;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
}

[data-theme="light"] .cert-btn-download:hover {
    background: linear-gradient(135deg, #059669, #047857);
    box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
}

@media (max-width: 768px) {
    .certifications {
        padding: 3rem 1rem;
    }

    .certifications-grid {
        grid-template-columns: 1fr;
    }

    .theme-toggle {
        top: 1rem;
        right: 1rem;
        width: 44px;
        height: 44px;
    }

    .cert-modal-overlay {
        padding: 1rem;
    }

    .cert-card-preview {
        width: 95vw;
        max-width: 95vw;
        padding: 1.5rem;
        gap: 1.5rem;
    }

    .cert-preview-title {
        font-size: 1.1rem;
    }

    .cert-preview-iframe {
        height: 50vh;
        min-height: 400px;
    }

    .cert-preview-actions {
        flex-direction: column;
    }

    .cert-btn {
        width: 100%;
    }
}
    </style>
</head>
<body>
    <!-- Back to Portfolio Button -->
    <a href="index.html#certifications" class="back-btn">← Back to Portfolio</a>
    
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
    </button>

    <!-- Certifications Section -->
    <section class="certifications" id="certifications">
        <div class="section-header">
            <h2 class="section-title">Certifications</h2>
            <p class="section-subtitle">Professional Credentials</p>
        </div>
        <div id="certificationsGrid" class="certifications-grid"></div>
    </section>

    <script>
/* ========================================
   CERTIFICATIONS PORTFOLIO - JAVASCRIPT
   ======================================== */

document.addEventListener('DOMContentLoaded', () => {
    initThemeToggle();
    initCertifications();
});

/* ========== THEME TOGGLE ========== */
function initThemeToggle() {
    const toggle = document.getElementById('themeToggle');
    if (!toggle) return;

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    toggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
}

/* ========== CERTIFICATIONS ========== */
function initCertifications() {
    const grid = document.getElementById('certificationsGrid');
    if (!grid) return;

    const certificates = [
        'AI-102.pdf',
        'PowerBi PL-300.pdf',
        'AZ-900.pdf',
        'Lean Six sigma Black Belt.pdf',
        'Lean Six sigma Green Belt.pdf',
        'Lean SIx sigma Yellow Belt.pdf',
        'Lean Six sigma White Belt.pdf',
        'Lean six sigma from Six sigma Academy Amsterdam.pdf',
        'AIGPE FEMA.pdf',
        'AIGPE FIVE FORCE.pdf',
        'AIGPE Mini Tab Beginner.pdf',
        'AIGPE PARENTO .pdf',
        'AIGPE QUALITY Function.pdf',
        'Just In time.pdf',
        'AIGPE AI-POWERED  ROOT CAUSE ANALYSIS.pdf',
        'AIGPE AI-POWERED WBS SPECIALIST.pdf',
        'AIGPE KANO ANALYSIS SPECIALIST.pdf',
        '8D PROBLEM SOLVING EXPERT .pdf',
        'Cyber security certificate.pdf',
        'Google Cloud Computing Foundations.pdf',
        'Internship certificate.pdf'
    ];

    const overlay = document.createElement('div');
    overlay.className = 'cert-modal-overlay';
    overlay.id = 'certModalOverlay';

    const modalContent = document.createElement('div');
    modalContent.className = 'cert-card-preview';

    const header = document.createElement('div');
    header.className = 'cert-preview-header';
    
    const title = document.createElement('h3');
    title.className = 'cert-preview-title';
    title.id = 'certPreviewTitle';
    
    const closeBtn = document.createElement('button');
    closeBtn.className = 'cert-preview-close';
    closeBtn.innerHTML = '&times;';
    closeBtn.onclick = closeModal;
    
    header.appendChild(title);
    header.appendChild(closeBtn);

    const body = document.createElement('div');
    body.className = 'cert-preview-body';
    
    const container = document.createElement('div');
    container.className = 'cert-preview-container';
    
    const iframe = document.createElement('iframe');
    iframe.className = 'cert-preview-iframe';
    iframe.id = 'certPreviewIframe';
    
    container.appendChild(iframe);
    body.appendChild(container);

    const actions = document.createElement('div');
    actions.className = 'cert-preview-actions';
    
    const closeActionBtn = document.createElement('button');
    closeActionBtn.className = 'cert-btn cert-btn-close';
    closeActionBtn.innerHTML = '✕ Close';
    closeActionBtn.onclick = closeModal;
    
    const viewBtn = document.createElement('a');
    viewBtn.className = 'cert-btn cert-btn-view';
    viewBtn.id = 'certViewBtn';
    viewBtn.innerHTML = '🔗 View in New Tab';
    viewBtn.target = '_blank';
    
    const downloadBtn = document.createElement('a');
    downloadBtn.className = 'cert-btn cert-btn-download';
    downloadBtn.id = 'certDownloadBtn';
    downloadBtn.innerHTML = '📥 Download';
    downloadBtn.target = '_blank';
    
    actions.appendChild(closeActionBtn);
    actions.appendChild(viewBtn);
    actions.appendChild(downloadBtn);

    modalContent.appendChild(header);
    modalContent.appendChild(body);
    modalContent.appendChild(actions);
    overlay.appendChild(modalContent);
    document.body.appendChild(overlay);

    function closeModal() {
        overlay.classList.remove('active');
        iframe.src = '';
        document.body.style.overflow = '';
    }

    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('active')) {
            closeModal();
        }
    });

    certificates.forEach((filename, index) => {
        const card = document.createElement('div');
        card.className = 'cert-card';
        card.style.animationDelay = `${index * 0.05}s`;
        
        const cleanedTitle = cleanTitle(filename);
        const pdfPath = `Certificates/${filename}`;
        
        const preview = document.createElement('div');
        preview.className = 'cert-preview';
        
        const embed = document.createElement('embed');
        embed.className = 'cert-preview-embed';
        embed.src = `${pdfPath}#page=1&view=FitH&toolbar=0&navpanes=0&scrollbar=0`;
        embed.type = 'application/pdf';
        
        preview.appendChild(embed);
        
        const info = document.createElement('div');
        info.className = 'cert-info';
        
        const titleEl = document.createElement('h3');
        titleEl.className = 'cert-title';
        titleEl.textContent = cleanedTitle;
        
        info.appendChild(titleEl);
        
        card.appendChild(preview);
        card.appendChild(info);

        card.addEventListener('click', (e) => {
            const viewBtn = document.getElementById('certViewBtn');
            const downloadBtn = document.getElementById('certDownloadBtn');
            
            title.textContent = cleanedTitle;
            iframe.src = pdfPath;
            viewBtn.href = pdfPath;
            downloadBtn.href = pdfPath;
            downloadBtn.download = filename;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });

        grid.appendChild(card);
    });
}

function cleanTitle(filename) {
    return filename
        .replace('.pdf', '')
        .replace(/_/g, ' ')
        .replace(/AIGPE /g, '')
        .replace(/  +/g, ' ')
        .trim();
}
    </script>
